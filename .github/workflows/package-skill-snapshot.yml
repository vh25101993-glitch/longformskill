name: Package skill snapshot

on:
  push:
    branches:
      - agent/add-narrative-publication-layer
  pull_request:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create clean skill archive
        run: |
          rm -rf .git .github
          zip -r longform-skill-snapshot.zip . -x "*/__pycache__/*" "*.pyc"
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: longform-skill-snapshot
          path: longform-skill-snapshot.zip
          if-no-files-found: error
