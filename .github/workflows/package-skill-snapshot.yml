name: Package skill snapshot

on:
  pull_request:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create clean skill archive
        run: |
          rm -rf .git .github
          zip -r longform-skill-snapshot.zip . -x "*/__pycache__/*" "*.pyc"
      - uses: actions/upload-artifact@v4
       